# Portfolio: public 37.60.240.195:3010 -> app 127.0.0.1:3010
#
# Paste this server block inside the http { } block of /etc/nginx/nginx.conf
# (replacing the existing "Portfolio" block), then:  sudo nginx -t && sudo systemctl reload nginx
#
# Same port on both sides is fine: nginx binds the public IP, the app binds 127.0.0.1 only.
# The app MUST keep HOST=127.0.0.1 (.env / ecosystem.prod.config.js) — HOST=0.0.0.0 would clash
# with nginx on port 3010 (EADDRINUSE).
#
# gzip, mime types and server_tokens are already set in the http { } block of nginx.conf.

upstream portfolio_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 37.60.240.195:3010;
    server_name _;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static site: no websockets, so keep upstream connections alive instead of "Connection: upgrade".
    location / {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite build output (dist/assets). Long-lived cache headers come from src/server.js.
    # add_header here replaces the server-level ones, so nosniff is repeated.
    location ^~ /assets/ {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
